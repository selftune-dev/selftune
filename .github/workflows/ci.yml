name: CI

on:
  push:
    branches: [main]
  merge_group:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      run_heavy: ${{ steps.policy.outputs.run_heavy }}
      desktop_matrix: ${{ steps.policy.outputs.desktop_matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify CI selection
        run: node --test .github/scripts/ci-policy.test.mjs
      - name: Select CI jobs
        id: policy
        run: node .github/scripts/ci-policy.mjs

  lint:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run_heavy == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful change selection
        env:
          RESULT: ${{ needs.changes.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx oxlint --format=github
      - run: bunx oxfmt --check
      - run: bun run lint-architecture.ts

  build-dashboard:
    needs: [changes, lint]
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Dashboard typecheck
        working-directory: apps/local-dashboard
        run: bunx tsc --noEmit
      - run: bun run build:dashboard

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
      - name: Pin npm to the release toolchain
        run: npm install --global npm@11
      - name: Pack and smoke the publication candidate
        shell: bash
        run: |
          set -euo pipefail
          bun run pack:release >/dev/null
          tarball="$(node -p "const pkg=require('./package.json'); pkg.name.replace(/^@/,'').replace(/\//g,'-') + '-' + pkg.version + '.tgz'")"
          bun run scripts/smoke-packed-package.ts "$tarball"
          echo "TARBALL_PATH=$tarball" >> "$GITHUB_ENV"
      - name: Install locked SBOM toolchain
        run: npm ci --prefix .github/sbom-toolchain --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Generate SBOM
        env:
          SBOM_TOOLCHAIN_DIR: ${{ github.workspace }}/.github/sbom-toolchain
          SBOM_OUTPUT: ${{ github.workspace }}/sbom.cdx.json
        run: bash .github/scripts/generate-sbom.sh

  test:
    needs: [changes, lint]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run_heavy == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful selection and lint
        env:
          SELECTION: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
        run: test "$SELECTION" = success && test "$LINT" = success
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Full workspace typecheck
        run: bun run typecheck
      - name: Full workspace tests
        run: bun run test
      - run: bun run --cwd apps/desktop test
      - run: bun run --cwd apps/desktop typecheck
      - run: bun run --cwd apps/selfhost test
      - run: bun run --cwd apps/selfhost typecheck
